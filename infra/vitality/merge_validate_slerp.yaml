merge_method: slerp
base_model: Qwen/Qwen3-8B
dtype: bfloat16
slices:
  - sources:
      - model: Qwen/Qwen3-8B
        layer_range: [0, N]
      - model: "<org/fine-tune-Qwen3-8B>"   # 2e checkpoint Qwen3-8B compatible
        layer_range: [0, N]
parameters:
  t:
    - filter: self_attn
      value: [0, 0.5, 0.3, 0.7, 1]
    - filter: mlp
      value: [1, 0.5, 0.7, 0.3, 0]
    - value: 0.5