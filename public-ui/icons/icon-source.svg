<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- =====================================================
       icon-source.svg — Logo canonique SkyAInet
       Étoile filante verte semi-claire.
       SOURCE UNIQUE de toutes les icônes système :
       build.js génère depuis ce fichier les PNG/ICO/ICNS
       (écran d'accueil, tray, barre des tâches, splash).
       Même identité visuelle que le bouton logo Lucide
       du dashboard SKYAINET.
       SkyAInet × Nikola T369
       ===================================================== -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#0e1c13"/>
    </linearGradient>
    <linearGradient id="star" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.55" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond app-icon arrondi -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="114" fill="none" stroke="#4ade80" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Traînée de l'étoile filante (bas-gauche → tête) -->
  <path d="M104 408 L232 280" stroke="url(#trail)" stroke-width="26" stroke-linecap="round"/>
  <path d="M150 410 L236 324" stroke="url(#trail)" stroke-width="15" stroke-linecap="round" opacity="0.6"/>
  <path d="M196 414 L240 370" stroke="url(#trail)" stroke-width="9"  stroke-linecap="round" opacity="0.4"/>

  <!-- Tête d'étoile (sparkle 4 branches, côtés concaves) -->
  <g filter="url(#glow)">
    <path d="M322 132
             C334 214 372 252 454 264
             C372 276 334 314 322 396
             C310 314 272 276 190 264
             C272 252 310 214 322 132 Z"
          fill="url(#star)"/>
  </g>
  <!-- Petit éclat secondaire -->
  <path d="M150 150 C155 178 170 193 198 198 C170 203 155 218 150 246 C145 218 130 203 102 198 C130 193 145 178 150 150 Z"
        fill="#86efac" opacity="0.85"/>
</svg>