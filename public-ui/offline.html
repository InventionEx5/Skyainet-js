<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyAInet — Offline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family:'Inter',system-ui,sans-serif; background:#0a0a0f; color:#fff; }
        @keyframes pulse-green { 0%,100%{opacity:1;transform:translateY(0)} 50%{opacity:.45;transform:translateY(-2px)} }
        .pulse { animation: pulse-green 2s ease-in-out infinite; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="text-center space-y-6 max-w-sm">
        <!-- Logo étoile filante verte (Lucide-style inline, cohérent dashboard) -->
        <div class="pulse mx-auto w-20 h-20 rounded-3xl flex items-center justify-center"
             style="background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.25)">
            <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24"
                 fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 4.8l1.1 3.1 3.1 1.1-3.1 1.1L16 13.2l-1.1-3.1L11.8 9l3.1-1.1z"/>
                <path d="M3.5 20.5l6.2-6.2"/>
                <path d="M4 15l2.5 2.5"/>
                <path d="M8.5 19.5l1.5 1.5"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold tracking-tight">Node Offline</h1>
        <p class="text-white/55 text-sm leading-relaxed">
            Your SkyAInet node is not reachable.<br>
            Start it, then retry below.
        </p>

        <div class="bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-left space-y-2">
            <div class="text-xs text-emerald-400/80 uppercase tracking-wider font-semibold">Start your node</div>
            <code class="text-emerald-400 text-sm block">SkyAInet</code>
            <div class="text-xs text-white/45">double-click the app, or run the binary</div>
        </div>

        <button onclick="window.location.reload()"
                class="w-full py-3 rounded-2xl text-sm font-semibold transition-all flex items-center justify-center gap-x-2 hover:brightness-110"
                style="background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.3);color:#4ade80">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
            </svg>
            <span>Retry connection</span>
        </button>
    </div>
</body>
</html>
