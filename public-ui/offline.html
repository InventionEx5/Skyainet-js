<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyAInet — Offline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family:'Inter',system-ui,sans-serif; background:#0a0a0f; color:#fff; }
        @keyframes blink-green { 0%,100%{opacity:1}50%{opacity:.2} }
        .blink { animation: blink-green 1.8s ease-in-out infinite; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="text-center space-y-6 max-w-sm">
        <div class="blink text-5xl">★</div>
        <h1 class="text-2xl font-bold tracking-tight">Node Offline</h1>
        <p class="text-white/50 text-sm leading-relaxed">
            Your SkyAInet node is not reachable.<br>
            Make sure <code class="text-emerald-400">node server.js</code> is running.
        </p>
        <div class="bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-left space-y-2">
            <div class="text-xs text-white/40 uppercase tracking-wider">Start your node</div>
            <code class="text-emerald-400 text-sm block">node server.js</code>
            <div class="text-xs text-white/30">then refresh this page</div>
        </div>
        <button onclick="window.location.reload()"
                class="w-full py-3 rounded-2xl text-sm font-semibold transition-all"
                style="background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.3);color:#4ade80">
            ↻ Retry
        </button>
    </div>
</body>
</html>
